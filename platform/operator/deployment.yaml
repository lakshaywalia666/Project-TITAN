apiVersion: apps/v1
kind: Deployment
metadata:
  name: titan-operator
  namespace: titan-system
  labels:
    app.kubernetes.io/name: titan-operator
    app.kubernetes.io/part-of: titan
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: titan-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: titan-operator
        app.kubernetes.io/part-of: titan
    spec:
      serviceAccountName: titan-operator
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: operator
          image: ghcr.io/example/titan:0.1.0
          imagePullPolicy: IfNotPresent
          command: [python, -m, titan_operator.controller]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - {name: TITAN_OPERATOR_POLL_SECONDS, value: "2"}
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: temporary, mountPath: /tmp}
      volumes:
        - name: temporary
          emptyDir: {sizeLimit: 32Mi}
