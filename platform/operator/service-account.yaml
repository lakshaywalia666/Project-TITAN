apiVersion: v1
kind: ServiceAccount
metadata:
  name: titan-operator
  namespace: titan-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: titan-operator
  namespace: titan-system
rules:
  - apiGroups: [platform.titan.dev]
    resources: [titanservices]
    verbs: [get, list, patch]
  - apiGroups: [platform.titan.dev]
    resources: [titanservices/status]
    verbs: [get, patch, update]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: titan-operator
  namespace: titan-system
subjects:
  - kind: ServiceAccount
    name: titan-operator
    namespace: titan-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: titan-operator
