apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: titanservices.platform.titan.dev
spec:
  group: platform.titan.dev
  scope: Namespaced
  names:
    plural: titanservices
    singular: titanservice
    kind: TitanService
    shortNames: [tsvc]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Ready, type: string, jsonPath: '.status.conditions[0].status'}
        - {name: Image, type: string, jsonPath: '.spec.image'}
        - {name: Age, type: date, jsonPath: '.metadata.creationTimestamp'}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  minLength: 1
                  pattern: '^(?!.*:latest$).+$'
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 20
                  default: 1
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  default: 8080
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
