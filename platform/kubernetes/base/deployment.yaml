apiVersion: apps/v1
kind: Deployment
metadata:
  name: titan-control-plane
  namespace: titan-system
  labels:
    app.kubernetes.io/name: titan-control-plane
    app.kubernetes.io/part-of: titan
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: titan-control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: titan-control-plane
        app.kubernetes.io/part-of: titan
    spec:
      serviceAccountName: titan-control-plane
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/example/titan:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "titan_control.api_main"]
          envFrom:
            - configMapRef:
                name: titan-control-plane
            - secretRef:
                name: titan-control-plane-secrets
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/titan
            - name: temporary
              mountPath: /tmp
        - name: controller
          image: ghcr.io/example/titan:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "titan_control.controller"]
          envFrom:
            - configMapRef:
                name: titan-control-plane
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/titan
            - name: temporary
              mountPath: /tmp
        - name: ai-api
          image: ghcr.io/example/titan:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "titan_ai.api_main"]
          envFrom:
            - configMapRef:
                name: titan-control-plane
            - secretRef:
                name: titan-control-plane-secrets
          ports:
            - name: ai-http
              containerPort: 8100
          readinessProbe:
            httpGet:
              path: /readyz
              port: ai-http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: ai-http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/titan
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: titan-control-data
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
