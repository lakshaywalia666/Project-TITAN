apiVersion: v1
kind: Service
metadata:
  name: titan-control-plane
  namespace: titan-system
  labels:
    app.kubernetes.io/name: titan-control-plane
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: titan-control-plane
  ports:
    - name: http
      port: 8090
      targetPort: http
    - name: ai-http
      port: 8100
      targetPort: ai-http
