apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/example/titan
    newName: titan
    newTag: local
patches:
  - target:
      kind: PersistentVolumeClaim
      name: titan-control-data
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 1Gi

