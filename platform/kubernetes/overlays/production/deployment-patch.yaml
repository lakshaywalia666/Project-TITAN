apiVersion: apps/v1
kind: Deployment
metadata:
  name: titan-control-plane
  namespace: titan-system
spec:
  # SQLite is intentionally single-writer. Move state to an external HA database
  # before increasing this replica count.
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: titan-control-plane
