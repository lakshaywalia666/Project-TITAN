apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "titan.fullname" . }}
  labels:
    {{- include "titan.labels" . | nindent 4 }}
data:
  TITAN_DATABASE: /var/lib/titan/titan-control.db
  TITAN_CONTROL_HOST: 0.0.0.0
  TITAN_CONTROL_PORT: {{ .Values.service.port | quote }}
  TITAN_RECONCILE_INTERVAL_SECONDS: {{ .Values.controlPlane.reconcileIntervalSeconds | quote }}
  TITAN_RECONCILE_BATCH_SIZE: "20"
  TITAN_JWT_ISSUER: titan-local
  TITAN_JWT_AUDIENCE: titan
  TITAN_AI_HOST: 0.0.0.0
  TITAN_AI_PORT: {{ .Values.ai.port | quote }}
  TITAN_KNOWLEDGE_DATABASE: /var/lib/titan/titan-knowledge.db
  TITAN_OFFLINE_MODEL: {{ .Values.ai.offlineModel | quote }}
  TITAN_AI_ALLOWED_MODELS_JSON: {{ printf "{\"local\":[%q]}" .Values.ai.offlineModel | quote }}
  TITAN_AI_TOKEN_BUDGETS_JSON: {{ printf "{\"local\":%v}" .Values.ai.localTokenBudget | quote }}
  TITAN_AI_REQUEST_LIMITS_JSON: '{"local":60}'
