apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "titan.fullname" . }}
  labels:
    {{- include "titan.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: titan
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: titan
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "titan.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "titan_control.api_main"]
          envFrom:
            - configMapRef: {name: {{ include "titan.fullname" . }}}
            - secretRef: {name: {{ .Values.controlPlane.adminTokenSecretName }}}
          ports:
            - {name: http, containerPort: 8090}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/titan}
            - {name: temporary, mountPath: /tmp}
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "titan_control.controller"]
          envFrom:
            - configMapRef: {name: {{ include "titan.fullname" . }}}
          resources:
            {{- toYaml .Values.resources.controller | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/titan}
            - {name: temporary, mountPath: /tmp}
        {{- if .Values.ai.enabled }}
        - name: ai-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "titan_ai.api_main"]
          envFrom:
            - configMapRef: {name: {{ include "titan.fullname" . }}}
            - secretRef: {name: {{ .Values.controlPlane.adminTokenSecretName }}}
          ports:
            - {name: ai-http, containerPort: {{ .Values.ai.port }}}
          readinessProbe:
            httpGet: {path: /readyz, port: ai-http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: ai-http}
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.resources.ai | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/titan}
            - {name: temporary, mountPath: /tmp}
        {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: {{ include "titan.fullname" . }}-data}
        - name: temporary
          emptyDir: {sizeLimit: 64Mi}
