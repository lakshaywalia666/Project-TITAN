global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: titan-control
    static_configs:
      - targets: [control-api:8090]
  - job_name: titan-ai
    static_configs:
      - targets: [ai-api:8100]
  - job_name: titan-shop
    static_configs:
      - targets: [titan-shop:8200]
