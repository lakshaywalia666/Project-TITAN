groups:
  - name: titan-slo
    rules:
      - record: job:titan_http_requests:rate5m
        expr: sum by (job) (rate(titan_http_requests_total[5m]))
      - record: job:titan_http_errors:ratio5m
        expr: |
          sum by (job) (rate(titan_http_requests_total{status_class=~"5.."}[5m]))
          /
          clamp_min(sum by (job) (rate(titan_http_requests_total[5m])), 0.000001)
      - alert: TitanFastErrorBudgetBurn
        expr: job:titan_http_errors:ratio5m > (14.4 * 0.001)
        for: 5m
        labels:
          severity: page
        annotations:
          summary: Titan is rapidly consuming its 99.9% availability budget
          runbook: docs/runbooks/high-error-rate.md
      - alert: TitanSlowErrorBudgetBurn
        expr: job:titan_http_errors:ratio5m > (2 * 0.001)
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: Titan is steadily consuming its 99.9% availability budget
          runbook: docs/runbooks/high-error-rate.md
      - alert: TitanTargetDown
        expr: up{job=~"titan-.*"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: A Titan service cannot be scraped
          runbook: docs/runbooks/service-down.md

