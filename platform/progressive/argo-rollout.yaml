apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: titan-shop
  namespace: titan-system
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: titan-shop}
  template:
    metadata:
      labels: {app.kubernetes.io/name: titan-shop}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: shop
          image: ghcr.io/example/titan-shop@sha256:replace-with-built-digest
          ports: [{name: http, containerPort: 8200}]
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
  strategy:
    canary:
      stableService: titan-shop-stable
      canaryService: titan-shop-canary
      steps:
        - setWeight: 5
        - pause: {duration: 5m}
        - analysis:
            templates: [{templateName: titan-shop-slo}]
        - setWeight: 25
        - pause: {duration: 10m}
        - setWeight: 100

