apiVersion: apps/v1
kind: Deployment
metadata:
  name: titan-vllm
  namespace: titan-system
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: titan-vllm}
  template:
    metadata:
      labels: {app.kubernetes.io/name: titan-vllm}
    spec:
      automountServiceAccountToken: false
      runtimeClassName: nvidia
      containers:
        - name: server
          image: vllm/vllm-openai:v0.6.6.post1
          args:
            - --model=Qwen/Qwen2.5-1.5B-Instruct
            - --dtype=half
            - --max-model-len=4096
            - --gpu-memory-utilization=0.85
          ports: [{name: http, containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests: {cpu: "2", memory: 8Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "8", memory: 20Gi, nvidia.com/gpu: "1"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: titan-vllm
  namespace: titan-system
spec:
  selector: {app.kubernetes.io/name: titan-vllm}
  ports: [{name: http, port: 8000, targetPort: http}]

