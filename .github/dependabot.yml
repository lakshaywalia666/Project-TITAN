version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      workflow-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(container)"

  - package-ecosystem: npm
    directory: /portal
    schedule:
      interval: monthly
    groups:
      portal-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(portal)"
